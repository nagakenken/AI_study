<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title>AIの分類ベン図</title>
  <desc>AIの中に機械学習が含まれ、機械学習の中に深層学習がある。深層学習の一部が生成AI。機械学習内の別領域にNLP。ルールベースはAI内で機械学習と並列。</desc>

  <!-- 外枠：AI -->
  <rect x="20" y="20" width="760" height="460" rx="14" ry="14"
        fill="#57606a" fill-opacity="0.06"
        stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="48" font-size="18" font-weight="700" fill="#1f2328">AI（人工知能 / Artificial Intelligence）</text>
  <text x="40" y="68" font-size="12" fill="#57606a">人間の判断を自動化するしくみ全般</text>

  <!-- ルールベース（並列・左側） -->
  <rect x="50" y="110" width="200" height="320" rx="12" ry="12"
        fill="#d4a72c" fill-opacity="0.14"
        stroke="#d4a72c" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6a14">ルールベース</text>
  <text x="150" y="170" text-anchor="middle" font-size="12" fill="#8a6a14">Rule-based</text>
  <text x="150" y="210" text-anchor="middle" font-size="12" fill="#1f2328">IF 〜 THEN で</text>
  <text x="150" y="228" text-anchor="middle" font-size="12" fill="#1f2328">人間がルールを記述</text>
  <text x="150" y="270" text-anchor="middle" font-size="12" fill="#1f2328">例：与信ルール、</text>
  <text x="150" y="288" text-anchor="middle" font-size="12" fill="#1f2328">迷惑メール判定</text>

  <!-- 機械学習（大円） -->
  <ellipse cx="520" cy="270" rx="240" ry="160"
           fill="#218bff" fill-opacity="0.12"
           stroke="#218bff" stroke-width="2"/>
  <text x="350" y="195" font-size="16" font-weight="700" fill="#0a5cc1">機械学習</text>
  <text x="350" y="213" font-size="12" fill="#0a5cc1">Machine Learning</text>

  <!-- NLP（機械学習内の別領域） -->
  <ellipse cx="380" cy="335" rx="70" ry="40"
           fill="#1a7f37" fill-opacity="0.18"
           stroke="#1a7f37" stroke-width="1.5"/>
  <text x="380" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#0f5524">NLP</text>
  <text x="380" y="351" text-anchor="middle" font-size="11" fill="#0f5524">自然言語処理</text>

  <!-- 深層学習（中円） -->
  <ellipse cx="560" cy="290" rx="160" ry="110"
           fill="#8250df" fill-opacity="0.14"
           stroke="#8250df" stroke-width="2"/>
  <text x="500" y="225" font-size="15" font-weight="700" fill="#5c2fa6">深層学習</text>
  <text x="500" y="241" font-size="12" fill="#5c2fa6">Deep Learning</text>

  <!-- 生成AI（小円：深層学習と一部重なり、機械学習に収まる） -->
  <ellipse cx="680" cy="290" rx="70" ry="50"
           fill="#cf222e" fill-opacity="0.16"
           stroke="#cf222e" stroke-width="2"/>
  <text x="680" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#9d1620">生成AI</text>
  <text x="680" y="306" text-anchor="middle" font-size="11" fill="#9d1620">Generative AI</text>

  <!-- 凡例 -->
  <g transform="translate(40,448)">
    <rect x="0" y="0" width="14" height="14" fill="#d4a72c" fill-opacity="0.4" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="22" y="12" font-size="11" fill="#1f2328">ルールベース</text>
    <rect x="120" y="0" width="14" height="14" fill="#218bff" fill-opacity="0.3" stroke="#218bff" stroke-width="1.5"/>
    <text x="142" y="12" font-size="11" fill="#1f2328">機械学習</text>
    <rect x="220" y="0" width="14" height="14" fill="#8250df" fill-opacity="0.3" stroke="#8250df" stroke-width="1.5"/>
    <text x="242" y="12" font-size="11" fill="#1f2328">深層学習</text>
    <rect x="320" y="0" width="14" height="14" fill="#cf222e" fill-opacity="0.3" stroke="#cf222e" stroke-width="1.5"/>
    <text x="342" y="12" font-size="11" fill="#1f2328">生成AI</text>
    <rect x="410" y="0" width="14" height="14" fill="#1a7f37" fill-opacity="0.3" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="432" y="12" font-size="11" fill="#1f2328">NLP（自然言語処理）</text>
  </g>
</svg>
